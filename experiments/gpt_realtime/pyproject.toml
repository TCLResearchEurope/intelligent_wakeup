[project]
name = "realtime-va"
version = "0.1.0"
description = "OpenAI Realtime API Virtual Assistant Demo"
requires-python = ">=3.8"
dependencies = [
    "websockets>=13.0",
    "pyaudio>=0.2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pylint>=3.2.7",
]
