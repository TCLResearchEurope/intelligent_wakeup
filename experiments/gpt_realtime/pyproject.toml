[project]
name = "realtime-va"
version = "0.1.0"
description = "OpenAI Realtime API Virtual Assistant Demo"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13.0",
    "pyaudio>=0.2.14",
]

[project.optional-dependencies]
# Corpus evaluation pulls the dataset from the Hub; torchcodec needs torch and
# a system FFmpeg to decode the audio column.
corpus = [
    "datasets>=4.0",
    "torchcodec>=0.1",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pylint>=3.2.7",
]
